name: Test and deploy

on:
  # Every push to main: run tests, then publish the site.
  push:
    branches: [main]
  # Weekly data refresh from Geofabrik's daily OpenStreetMap download.
  # Mondays at 3:17 UTC (late Sunday night in Richmond).
  schedule:
    - cron: '17 3 * * 1'
  # Lets you run it by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install osmium
        if: github.event_name != 'push'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      - name: Refresh park data
        id: refresh
        if: github.event_name != 'push'
        # If the download fails, keep going and publish the existing data.
        continue-on-error: true
        timeout-minutes: 20
        run: npm run fetch-parks

      - name: Flag a failed refresh
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::warning title=Park data not refreshed::The data refresh failed, so the site was published with the existing park data. Open the 'Refresh park data' step for details."
          echo "### ⚠️ Park data was not refreshed" >> "$GITHUB_STEP_SUMMARY"
          echo "The site was published with the existing data. Check the **Refresh park data** step for the error." >> "$GITHUB_STEP_SUMMARY"

      - name: Save refreshed data
        if: github.event_name != 'push'
        run: |
          if git diff --quiet src/data/parks.json; then
            echo "Park data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/parks.json
          git commit -m "Refresh park data from OpenStreetMap"
          git push

      - name: Check code
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5